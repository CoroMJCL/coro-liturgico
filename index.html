<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f5">
<title>TEMPVS7 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ═══════════════════════════════════════════
   VARIABLES — Windows 11 Light
═══════════════════════════════════════════ */
:root{
  --bg:#f3f3f3; --bg2:#ebebeb;
  --surface:#ffffff; --surface2:#f9f9f9; --surface3:#f0f0f0;
  --border:#e0e0e0; --border2:#d1d1d1;
  --accent:#0067c0; --accent-lt:#ddeeff; --accent-dk:#005099;
  --text:#1a1a1a; --text2:#444; --text3:#767676;
  --red:#c42b1c; --green:#107c10; --amber:#9a6700;
  --shadow:0 2px 8px rgba(0,0,0,.08);
  --shadow-md:0 4px 20px rgba(0,0,0,.13);
  --r:8px; --rs:4px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}

/* ═══════════════════════════════════════════
   LOGIN SCREEN
═══════════════════════════════════════════ */
#login-screen{
  position:fixed;inset:0;background:linear-gradient(135deg,#e8f0fe 0%,#f3f3f3 50%,#e8f0fe 100%);
  display:flex;align-items:center;justify-content:center;z-index:500;
  transition:opacity .3s;
}
#login-screen.hidden{opacity:0;pointer-events:none;}
.login-card{
  background:var(--surface);border-radius:12px;
  box-shadow:var(--shadow-md);padding:2.4rem 2.2rem;
  width:360px;max-width:92vw;
}
.login-brand{text-align:center;margin-bottom:1.8rem;}
.login-icon{
  width:110px;height:110px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
}
.login-icon img{width:100%;height:100%;object-fit:contain;}
.login-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--text);}
.login-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.field{margin-bottom:12px;}
.field label{font-size:12px;font-weight:500;color:var(--text2);display:block;margin-bottom:4px;}
.field input{
  width:100%;border:1px solid var(--border2);border-radius:var(--rs);
  padding:8px 11px;font-size:14px;font-family:inherit;
  background:var(--surface2);color:var(--text);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-lt);}
.login-err{font-size:12px;color:var(--red);margin-bottom:10px;min-height:16px;}
.btn-login{
  width:100%;background:var(--accent);color:#fff;border:none;
  border-radius:var(--rs);padding:9px;font-size:14px;font-weight:500;
  font-family:inherit;cursor:pointer;transition:background .15s;margin-top:4px;
}
.btn-login:hover{background:var(--accent-dk);}

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 1.2rem;display:flex;align-items:center;
  justify-content:space-between;height:48px;
  position:sticky;top:0;z-index:100;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.logo{display:flex;align-items:center;gap:9px;}
.logo-icon{
  width:32px;height:32px;flex-shrink:0;
}
.logo-icon img{width:100%;height:100%;object-fit:contain;}
.logo-text{font-size:14px;font-weight:600;color:var(--text);letter-spacing:.04em;}
.logo-ver{font-size:11px;color:var(--text3);font-weight:400;margin-left:4px;}
.menu-toggle{display:none;background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:var(--rs);}
.menu-toggle:hover{background:var(--surface3);}
nav{display:flex;gap:2px;}
nav button{
  background:none;border:none;color:var(--text2);
  padding:6px 14px;border-radius:var(--rs);cursor:pointer;
  font-family:inherit;font-size:13px;transition:all .12s;
  display:flex;align-items:center;gap:5px;position:relative;
}
nav button:hover{background:var(--surface3);color:var(--text);}
nav button.active{background:var(--accent-lt);color:var(--accent);font-weight:600;}
nav button.active::after{
  content:'';position:absolute;bottom:-1px;left:14px;right:14px;
  height:2px;background:var(--accent);border-radius:2px 2px 0 0;
}
.header-right{display:flex;align-items:center;gap:8px;}
.user-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:3px 10px 3px 4px;cursor:default;
}
.user-avatar{
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:#fff;flex-shrink:0;
}
.user-avatar.director{background:var(--accent);}
.user-avatar.integrante{background:var(--green);}
.user-name{font-size:12px;font-weight:500;color:var(--text2);}
.user-role{font-size:10px;color:var(--text3);}
.btn-logout{
  background:none;border:1px solid var(--border2);color:var(--text3);
  border-radius:var(--rs);padding:4px 10px;cursor:pointer;
  font-size:12px;font-family:inherit;transition:all .12s;
}
.btn-logout:hover{background:var(--surface3);color:var(--red);border-color:var(--red);}

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
.app{display:flex;height:calc(100vh - 48px);overflow:hidden;}

/* ── SIDEBAR ── */
.sidebar{
  width:280px;min-width:240px;background:var(--surface2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sidebar-header{padding:.75rem;border-bottom:1px solid var(--border);background:var(--surface);}
.search-box{
  display:flex;align-items:center;gap:7px;
  background:var(--bg);border:1px solid var(--border2);
  border-radius:var(--rs);padding:6px 10px;transition:border-color .12s;
}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-lt);}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:13px;flex:1;}
.search-box input::placeholder{color:var(--text3);}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px;}
.chip{
  font-size:11px;padding:3px 9px;border-radius:20px;cursor:pointer;
  border:1px solid var(--border2);color:var(--text2);background:var(--surface);
  font-family:inherit;transition:all .12s;
}
.chip:hover{border-color:var(--accent);color:var(--accent);}
.chip.active{background:var(--accent-lt);border-color:var(--accent);color:var(--accent);font-weight:500;}
.song-list{overflow-y:auto;flex:1;}
.song-list::-webkit-scrollbar{width:4px;}
.song-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.song-item{
  padding:8px 12px;border-bottom:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .1s;
}
.song-item:hover{background:var(--bg);}
.song-item.active{background:var(--accent-lt);border-left:3px solid var(--accent);}
.song-num{font-size:10px;color:var(--text3);min-width:18px;text-align:right;}
.song-info{flex:1;min-width:0;}
.song-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song-sub{font-size:11px;color:var(--text3);}
.song-badges{display:flex;gap:3px;}
.badge{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:500;white-space:nowrap;}
.badge-e{background:#e6f4ea;color:#1e7e34;}
.badge-o{background:#e8f0fe;color:#1967d2;}
.badge-c{background:#fff3e0;color:#e65100;}
.badge-f{background:#fce8e6;color:#c62828;}
.badge-k{background:#f3e8fd;color:#7b1fa2;}
.add-btn{
  width:22px;height:22px;border-radius:var(--rs);
  background:var(--accent);border:none;color:#fff;
  cursor:pointer;font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s;flex-shrink:0;
}
.song-item:hover .add-btn{opacity:1;}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.view{display:none;flex:1;overflow:hidden;flex-direction:column;}
.view.active{display:flex;}

/* ── SONG HEADER ── */
.song-view-header{
  padding:.9rem 1.4rem .75rem;border-bottom:1px solid var(--border);
  background:var(--surface);flex-shrink:0;
}
.song-view-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;line-height:1.2;}
.song-view-meta{color:var(--text3);font-size:12px;margin-top:2px;}
.toolbar{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap;}
.tool-btn{
  background:var(--surface);border:1px solid var(--border2);color:var(--text2);
  border-radius:var(--rs);padding:5px 12px;cursor:pointer;font-size:12px;
  font-family:inherit;display:flex;align-items:center;gap:4px;transition:all .12s;
}
.tool-btn:hover{background:var(--surface3);color:var(--text);}
.tool-btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.tool-btn.accent:hover{background:var(--accent-dk);}
.key-selector{
  display:flex;align-items:center;gap:7px;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--rs);padding:4px 10px;
}
.key-selector label{font-size:12px;color:var(--text3);}
.key-selector select{background:none;border:none;outline:none;color:var(--accent);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;}

/* ── HOJA ── */
.song-scroll-area{flex:1;overflow-y:auto;background:#c8c8c8;padding:14px;}
.song-scroll-area::-webkit-scrollbar{width:4px;}
.song-scroll-area::-webkit-scrollbar-thumb{background:#aaa;border-radius:4px;}
.song-sheet{
  background:#fff;max-width:740px;margin:0 auto;
  padding:26px 30px 32px;border-radius:2px;
  box-shadow:0 2px 14px rgba(0,0,0,.22);
  font-family:'Inter',sans-serif;color:#111;position:relative;
}
.sheet-org{font-size:9.5px;color:#555;line-height:1.4;margin-bottom:1px;}
.sheet-tag{font-size:10.5px;font-weight:700;color:#c00;position:absolute;top:26px;right:30px;text-transform:uppercase;letter-spacing:.05em;}
.sheet-title{font-size:21px;font-weight:700;text-align:center;color:#111;margin:8px 0 2px;}
.sheet-subtitle{font-size:12px;color:#555;text-align:center;margin-bottom:16px;}
.sheet-divider{border:none;border-top:1px solid #ccc;margin:12px 0;}
.sheet-columns{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;}
.sheet-section{margin-bottom:14px;break-inside:avoid;}
.sheet-section-name{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#888;font-weight:500;margin-bottom:5px;}
.chord-row{display:flex;flex-wrap:wrap;margin-bottom:0;}
.syl{display:inline-flex;flex-direction:column;margin-right:2px;}
.syl-chord{font-size:10.5px;font-weight:700;color:#c00;line-height:1.25;min-width:4px;white-space:nowrap;}
.syl-chord.empty{color:transparent;user-select:none;}
.syl-text{font-size:13px;color:#111;line-height:1.6;white-space:pre;}
.sheet-chorus .syl-text{font-weight:700;}
.sheet-chorus .syl-chord{font-size:11px;}
.bis-wrapper{position:relative;padding-right:20px;display:inline-block;width:100%;}
.bis-bracket{position:absolute;right:0;top:0;bottom:0;border-right:2px solid #555;border-top:2px solid #555;border-bottom:2px solid #555;width:8px;}
.bis-label{position:absolute;right:-32px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;color:#555;}
.sheet-page{font-size:9px;color:#aaa;text-align:right;margin-top:18px;}

/* ── AUDIO ── */
.audio-bar{
  padding:.5rem 1.4rem;background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.play-btn{width:30px;height:30px;border-radius:50%;background:var(--accent);border:none;color:#fff;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.audio-info{flex:1;min-width:0;}
.audio-filename{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.audio-progress{width:100%;height:3px;background:var(--border2);border-radius:3px;margin-top:4px;cursor:pointer;}
.audio-fill{height:100%;background:var(--accent);border-radius:3px;width:0%;transition:width .3s;}

/* ── PAUTA ── */
.pauta-view{padding:1.1rem 1.4rem;overflow-y:auto;flex:1;}
.pauta-view::-webkit-scrollbar{width:4px;}
.pauta-view::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.pauta-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px;}
.pauta-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;}
.pauta-actions{display:flex;gap:6px;flex-wrap:wrap;}
.pauta-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1rem;}
.meta-field label{font-size:11px;color:var(--text3);display:block;margin-bottom:3px;font-weight:500;}
.meta-field input{
  width:100%;background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--rs);color:var(--text);padding:6px 10px;
  font-family:inherit;font-size:13px;outline:none;transition:border-color .12s;
}
.meta-field input:focus{border-color:var(--accent);}
.meta-field input:read-only{background:var(--surface3);color:var(--text3);cursor:default;}
.meta-field select:disabled{background:var(--surface3);color:var(--text3);cursor:default;opacity:1;}
.moments-grid{display:flex;flex-direction:column;gap:6px;}

/* ── MOMENT CARD ── */
.moment-card{
  background:var(--surface);border-radius:var(--r);
  border:1px solid var(--border);overflow:hidden;
  transition:box-shadow .15s,opacity .15s;
}
.moment-card.drag-over{box-shadow:0 0 0 2px var(--accent);}
.moment-card.dragging{opacity:.4;}
.moment-header{
  padding:7px 10px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border);background:var(--surface2);
}
.drag-handle{
  cursor:grab;color:var(--text3);font-size:15px;
  padding:0 2px;line-height:1;flex-shrink:0;user-select:none;
}
.drag-handle:active{cursor:grabbing;}
.moment-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.moment-name{font-size:13px;font-weight:600;flex:1;}
.moment-count{font-size:11px;color:var(--text3);}
.moment-actions-btns{display:flex;gap:2px;}
.m-btn{
  background:none;border:none;cursor:pointer;color:var(--text3);
  font-size:12px;padding:3px 6px;border-radius:var(--rs);
  transition:all .1s;line-height:1;
}
.m-btn:hover{background:var(--surface3);color:var(--accent);}
.m-btn.del:hover{color:var(--red);}
.moment-drop{min-height:44px;padding:6px;display:flex;flex-direction:column;gap:4px;}
.pauta-song{
  display:flex;align-items:center;gap:8px;
  background:var(--surface2);border-radius:var(--rs);
  padding:6px 10px;border:1px solid var(--border);
}
.pauta-song .ps-title{font-size:13px;font-weight:500;}
.pauta-song .ps-sub{font-size:11px;color:var(--text3);}
.remove-song{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:0 2px;margin-left:auto;line-height:1;border-radius:var(--rs);}
.remove-song:hover{color:var(--red);}
.drop-hint{
  text-align:center;font-size:12px;color:var(--text3);
  padding:10px 0;border:1px dashed var(--border2);border-radius:var(--rs);
}

/* ── CONFIG ── */
.config-view{padding:1.1rem 1.4rem;overflow-y:auto;flex:1;}
.config-section{margin-bottom:1.3rem;}
.config-section h3{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em;}
.config-field{margin-bottom:8px;}
.config-field label{font-size:12px;color:var(--text2);display:block;margin-bottom:3px;}
.config-field input{
  width:100%;background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--rs);color:var(--text);padding:6px 11px;
  font-family:inherit;font-size:13px;outline:none;transition:border-color .15s;
}
.config-field input:focus{border-color:var(--accent);}
.config-hint{font-size:11px;color:var(--text3);margin-top:3px;}
.config-hint a{color:var(--accent);}
.btn-primary{
  background:var(--accent);color:#fff;border:none;border-radius:var(--rs);
  padding:7px 15px;cursor:pointer;font-size:13px;font-weight:500;
  font-family:inherit;margin-right:6px;transition:background .12s;
}
.btn-primary:hover{background:var(--accent-dk);}
.btn-sec{
  background:var(--surface);color:var(--text2);border:1px solid var(--border2);
  border-radius:var(--rs);padding:7px 15px;cursor:pointer;font-size:13px;font-family:inherit;
  transition:background .12s;
}
.btn-sec:hover{background:var(--surface3);}
.info-card{
  background:var(--accent-lt);border:1px solid #b3d4f0;
  border-radius:var(--r);padding:12px 14px;margin-bottom:1rem;
}
.info-card h4{color:var(--accent-dk);font-size:13px;font-weight:600;margin-bottom:5px;}
.info-card p{color:var(--text2);font-size:12px;line-height:1.7;}
.info-card code{background:#fff;padding:1px 5px;border-radius:3px;font-family:monospace;font-size:11px;color:var(--accent);}
.step-list{display:flex;flex-direction:column;gap:7px;margin-top:7px;}
.step{display:flex;gap:9px;align-items:flex-start;}
.step-num{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.step p{font-size:12px;color:var(--text2);line-height:1.6;}
.step a{color:var(--accent);}

/* ── USUARIOS ── */
.users-section{margin-top:1.5rem;}
.user-table{width:100%;border-collapse:collapse;font-size:13px;}
.user-table th{text-align:left;padding:6px 10px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--border);}
.user-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.user-table tr:hover td{background:var(--surface2);}
.role-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;}
.role-badge.director{background:#ddeeff;color:var(--accent);}
.role-badge.integrante{background:#e6f4ea;color:var(--green);}
.btn-del-user{background:none;border:1px solid var(--border2);color:var(--text3);border-radius:var(--rs);padding:3px 9px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .12s;}
.btn-del-user:hover{background:#fce8e6;border-color:var(--red);color:var(--red);}
.add-user-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.add-user-row input, .add-user-row select{
  background:var(--surface);border:1px solid var(--border2);border-radius:var(--rs);
  padding:6px 10px;font-family:inherit;font-size:13px;color:var(--text);outline:none;
}
.add-user-row input:focus, .add-user-row select:focus{border-color:var(--accent);}

/* ── EMPTY STATE ── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10px;color:var(--text3);text-align:center;padding:2rem;}
.empty-state .icon{font-size:36px;opacity:.4;}
.empty-state h3{font-size:15px;font-family:'Cormorant Garamond',serif;color:var(--text2);}
.empty-state p{font-size:12px;max-width:280px;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:1.5rem;right:1.5rem;
  background:var(--text);color:#fff;
  padding:9px 16px;border-radius:var(--r);font-size:13px;
  opacity:0;transform:translateY(8px);transition:all .22s;
  z-index:999;pointer-events:none;box-shadow:var(--shadow-md);
}
.toast.show{opacity:1;transform:translateY(0);}

/* ── MODAL ── */
/* ── AI IMPORT ── */
.ai-loading-bar{
  background:linear-gradient(135deg,#6a00f4,#c800ff);
  color:#fff;padding:10px 1.4rem;font-size:13px;
  display:flex;align-items:center;gap:10px;flex-shrink:0;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.7;}}
.ai-error-bar{
  background:#fce8e6;color:#c62828;border-top:2px solid #e05a5a;
  padding:10px 1.4rem;font-size:13px;flex-shrink:0;
}

/* ── EDIT SONG PANEL ── */
.edit-song-panel{
  background:var(--accent-lt);border-top:2px solid var(--accent);
  padding:12px 1.4rem;display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;
  flex-shrink:0;
}
.edit-song-panel label{font-size:11px;font-weight:600;color:var(--accent-dk);display:block;margin-bottom:3px;}
.edit-song-panel input{
  background:var(--surface);border:1px solid var(--border2);border-radius:var(--rs);
  color:var(--text);padding:6px 10px;font-size:13px;font-family:inherit;outline:none;
  transition:border-color .12s;
}
.edit-song-panel input:focus{border-color:var(--accent);}
.edit-field-name{flex:2;min-width:160px;}
.edit-field-name input{width:100%;}
.edit-field-author{flex:1;min-width:120px;}
.edit-field-author input{width:100%;}
.edit-moments-wrap{flex:2;min-width:180px;}
.edit-moments-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.edit-moment-chip{
  font-size:11px;padding:3px 10px;border-radius:20px;cursor:pointer;
  border:1px solid var(--border2);color:var(--text2);background:var(--surface);
  font-family:inherit;transition:all .12s;
}
.edit-moment-chip.on{font-weight:600;color:#fff;}
.edit-moment-chip:hover{opacity:.85;}
.edit-save-btn{
  background:var(--accent);color:#fff;border:none;border-radius:var(--rs);
  padding:7px 18px;cursor:pointer;font-size:13px;font-weight:600;
  font-family:inherit;transition:background .12s;white-space:nowrap;align-self:flex-end;
}
.edit-save-btn:hover{background:var(--accent-dk);}
.edit-delete-btn{
  background:none;color:var(--red);border:1px solid var(--red);border-radius:var(--rs);
  padding:7px 12px;cursor:pointer;font-size:12px;font-family:inherit;
  transition:all .12s;white-space:nowrap;align-self:flex-end;
}
.edit-delete-btn:hover{background:#fce8e6;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:1.4rem;width:360px;max-width:92vw;
  box-shadow:var(--shadow-md);
  transform:translateY(10px);transition:transform .2s;
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal h3{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--text);margin-bottom:1rem;}
.modal label{font-size:12px;font-weight:500;color:var(--text2);display:block;margin-bottom:3px;}
.modal input{
  width:100%;background:var(--surface2);border:1px solid var(--border2);
  border-radius:var(--rs);color:var(--text);padding:7px 10px;
  font-size:13px;font-family:inherit;outline:none;margin-bottom:10px;
  transition:border-color .12s;
}
.modal input:focus{border-color:var(--accent);}
.modal-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:4px;}
.color-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.color-swatch{
  width:24px;height:24px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:all .12s;
}
.color-swatch:hover{transform:scale(1.15);}
.color-swatch.selected{border-color:var(--text);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text);}

/* ── QR MODAL ── */
.qr-modal{width:400px;}
.qr-box{display:flex;justify-content:center;margin:1rem 0;background:#fff;border-radius:8px;padding:14px;border:1px solid var(--border);}
.qr-info{font-size:12px;color:var(--text3);text-align:center;line-height:1.6;}
.qr-url{font-size:10px;color:var(--text2);word-break:break-all;background:var(--surface2);border-radius:var(--rs);padding:7px 9px;margin-top:8px;font-family:monospace;border:1px solid var(--border);}

/* ── VISTA PÚBLICA ── */
.public-view{display:none;}
body.is-public .app{display:none;}
body.is-public header{display:none;}
body.is-public #login-screen{display:none;}
body.is-public .public-view{
  display:block;padding:1.2rem;max-width:780px;margin:0 auto;
}
.pub-header{text-align:center;padding:1.2rem 0 .8rem;border-bottom:2px solid var(--accent-lt);margin-bottom:1.2rem;}
.pub-title{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--accent);}
.pub-meta{font-size:13px;color:var(--text3);margin-top:4px;}
.pub-category{margin-bottom:1.2rem;}
.pub-cat-name{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);margin-bottom:.5rem;padding-left:2px;font-weight:600;}
.pub-song-card{background:var(--surface);border-radius:var(--rs);padding:.85rem 1rem;margin-bottom:.45rem;border-left:3px solid var(--border2);box-shadow:0 1px 4px rgba(0,0,0,.06);}
.pub-song-title{font-size:15px;font-weight:600;}
.pub-song-sub{font-size:12px;color:var(--text3);margin-top:2px;}

/* ── ACCESS DENIED ── */
.access-denied{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;gap:12px;color:var(--text3);text-align:center;padding:3rem;
}
.access-denied .icon{font-size:40px;}
.access-denied h3{font-size:16px;color:var(--text2);font-family:'Cormorant Garamond',serif;}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  /* ── HEADER ── */
  header{padding:0 .8rem;height:52px;}
  .menu-toggle{display:flex;}
  nav{gap:0;}
  nav button{padding:5px 8px;font-size:12px;}
  nav button span:last-child{display:none;}
  .user-pill .user-name,.user-pill .user-role{display:none;}
  .btn-logout{padding:4px 8px;font-size:11px;}
  .logo-text{font-size:13px;}

  /* ── LAYOUT ── */
  .app{height:calc(100vh - 52px);position:relative;}

  /* ── SIDEBAR: panel deslizante desde la izquierda ── */
  .sidebar{
    width:88vw;max-width:320px;
    position:absolute;left:-100%;top:0;bottom:0;z-index:50;
    transition:left .25s;box-shadow:4px 0 20px rgba(0,0,0,.15);
  }
  .sidebar.open{left:0;}

  /* ── OVERLAY al abrir sidebar ── */
  .sidebar-overlay{
    display:none;position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:49;
  }
  .sidebar.open ~ .sidebar-overlay{display:block;}

  /* ── SONG LIST items más grandes para touch ── */
  .song-item{padding:11px 12px;min-height:56px;}
  .song-title{font-size:14px;}
  .song-sub{font-size:12px;}

  /* ── SONG HEADER ── */
  .song-view-header{padding:.7rem 1rem .6rem;}
  .song-view-title{font-size:19px;}
  .song-view-meta{font-size:11px;}

  /* ── TOOLBAR: scroll horizontal ── */
  .toolbar{
    display:flex;flex-wrap:nowrap;overflow-x:auto;gap:5px;
    padding-bottom:4px;-webkit-overflow-scrolling:touch;
  }
  .toolbar::-webkit-scrollbar{display:none;}
  .tool-btn{white-space:nowrap;padding:6px 10px;font-size:12px;flex-shrink:0;}
  .key-selector{flex-shrink:0;}

  /* ── HOJA DE ACORDES ── */
  .sheet-columns{grid-template-columns:1fr;}
  .song-sheet{padding:16px 14px 22px;max-width:100%;}
  .sheet-tag{top:16px;right:14px;}
  .sheet-title{font-size:18px;}
  .syl-text{font-size:14px;}
  .syl-chord{font-size:11px;}

  /* ── AUDIO BAR ── */
  .audio-bar{padding:.5rem .8rem;}

  /* ── EDIT PANEL ── */
  .edit-song-panel{flex-direction:column;gap:8px;padding:12px 1rem;}
  .edit-field-name,.edit-field-author,.edit-moments-wrap{min-width:0;width:100%;}
  .edit-save-btn,.edit-delete-btn{width:100%;text-align:center;}

  /* ── PAUTA ── */
  .pauta-meta{grid-template-columns:1fr;}
  .pauta-view{padding:.8rem 1rem;}
  .pauta-header{flex-direction:column;align-items:flex-start;}
  .pauta-actions{width:100%;}
  .pauta-actions .tool-btn{flex:1;justify-content:center;}

  /* ── CONFIG ── */
  .config-view{padding:.8rem 1rem;}
  .add-user-row{flex-direction:column;}
  .add-user-row input,.add-user-row select{width:100%;}

  /* ── MODALES ── */
  .modal{width:94vw;padding:1.1rem;}
  .qr-modal{width:94vw;}
}

/* ── Pantallas muy pequeñas (iPhone SE, etc.) ── */
@media(max-width:390px){
  nav button{padding:4px 6px;font-size:11px;}
  .song-view-title{font-size:17px;}
  .tool-btn{padding:5px 8px;font-size:11px;}
}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════
//  ACORDES
// ═══════════════════════════════════════════════════════════
const NOTAS=['DO','DO#','RE','RE#','MI','FA','FA#','SOL','SOL#','LA','LA#','SI'];
const ALT={'DOb':'SI','REb':'DO#','MIb':'RE#','FAb':'MI','SOLb':'FA#','LAb':'SOL#','SIb':'LA#'};
function parseChord(c){
  if(!c)return null;
  const m=c.match(/^(SOL|DO|RE|MI|FA|LA|SI)([b#])?(m)?(.*)/i);
  if(!m)return null;
  let root=m[1].toUpperCase(),acc=m[2]||'',isM=!!m[3],suf=m[4]||'';
  let norm=ALT[root+acc]||(root+acc);
  let idx=NOTAS.indexOf(norm);
  if(idx===-1)return null;
  return{idx,isMinor:isM,suffix:suf};
}
function transposeChord(c,semis){
  if(!c||!c.trim())return c;
  const p=parseChord(c);if(!p)return c;
  const ni=((p.idx+semis)%12+12)%12;
  const root=NOTAS[ni];
  let res=root+(p.isMinor?'m':'')+p.suffix;
  const disp={'MIm':'Mim','LAm':'Lam','SIm':'Sim','REm':'Rem','DOm':'Dom','SOLm':'Solm','FAm':'Fam'};
  return disp[res]||res;
}
function keyIdx(k){const p=parseChord(k);return p?p.idx:0;}
function keyIsMinor(k){const p=parseChord(k);return p&&p.isMinor;}
const KEY_OPTS_MAYOR=['DO','DO#','RE','RE#','MI','FA','FA#','SOL','SOL#','LA','LA#','SI'];
const KEY_OPTS_MENOR=['Dom','DO#m','Rem','RE#m','Mim','Fam','FA#m','Solm','SOL#m','Lam','LA#m','Sim'];

// ═══════════════════════════════════════════════════════════
//  USUARIOS — gestión en localStorage
// ═══════════════════════════════════════════════════════════
const DEFAULT_USERS=[
  {username:'director',password:'director123',role:'director',name:'Director'},
  {username:'coro',password:'coro2024',role:'integrante',name:'Integrante'}
];
function getUsers(){return JSON.parse(localStorage.getItem('t7_users')||'null')||DEFAULT_USERS;}
function saveUsers(u){localStorage.setItem('t7_users',JSON.stringify(u));}

let currentUser=null;

function doLogin(){
  const u=document.getElementById('l-user').value.trim();
  const p=document.getElementById('l-pass').value;
  const users=getUsers();
  const found=users.find(x=>x.username===u&&x.password===p);
  if(!found){document.getElementById('login-err').textContent='Usuario o contraseña incorrectos';return;}
  currentUser=found;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('user-pill').style.display='flex';
  document.getElementById('btn-logout').style.display='block';
  document.getElementById('user-display-name').textContent=found.name;
  document.getElementById('user-display-role').textContent=found.role==='director'?'Director':'Integrante';
  const av=document.getElementById('user-avatar');
  av.textContent=found.name[0].toUpperCase();
  av.className='user-avatar '+(found.role==='director'?'director':'integrante');
  applyRoleUI();
  renderList();renderMoments();renderFilterChips();
  setTimeout(()=>document.getElementById('login-screen').style.display='none',300);
}
function doLogout(){
  currentUser=null;
  document.getElementById('login-screen').style.display='flex';
  setTimeout(()=>document.getElementById('login-screen').classList.remove('hidden'),10);
  document.getElementById('user-pill').style.display='none';
  document.getElementById('btn-logout').style.display='none';
  document.getElementById('l-user').value='';
  document.getElementById('l-pass').value='';
  document.getElementById('login-err').textContent='';
}
function isDirector(){return currentUser&&currentUser.role==='director';}

function applyRoleUI(){
  // Barra de acciones pauta
  const bar=document.getElementById('pauta-actions-bar');
  if(isDirector()){
    bar.innerHTML=`
      <button class="tool-btn" onclick="openCatModal()">＋ Categoría</button>
      <button class="tool-btn" onclick="clearPauta()">🗑 Limpiar</button>
      <button class="tool-btn accent" onclick="exportPauta()">📄 Exportar</button>
      <button class="tool-btn" onclick="sharePauta()">🔗 Compartir</button>
      <button class="tool-btn" onclick="showQR()">📱 QR Asamblea</button>`;
  }else{
    bar.innerHTML=`<button class="tool-btn" onclick="showQR()">📱 QR Asamblea</button>`;
  }
  // Bloquear campos pauta para integrante
  ['pauta-fecha','pauta-liturgia','pauta-parroquia','pauta-responsable'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.readOnly=!isDirector();
  });
  const tipoEl=document.getElementById('pauta-tipo');
  if(tipoEl)tipoEl.disabled=!isDirector();
  // Nav config: ocultar para integrante? No, mostrar pero restringir contenido
  renderConfigView();
}

function renderConfigView(){
  const div=document.getElementById('config-inner');
  if(!isDirector()){
    div.innerHTML=`<div class="access-denied"><div class="icon">🔒</div><h3>Acceso restringido</h3><p style="font-size:13px;color:var(--text3)">Solo el Director puede acceder a la configuración.</p></div>`;
    return;
  }
  div.innerHTML=`

function addUser(){
  const name=document.getElementById('nu-name').value.trim();
  const username=document.getElementById('nu-user').value.trim();
  const password=document.getElementById('nu-pass').value;
  const role=document.getElementById('nu-role').value;
  if(!name||!username||!password){showToast('Completa todos los campos');return;}
  const users=getUsers();
  if(users.find(u=>u.username===username)){showToast('Ese usuario ya existe');return;}
  users.push({name,username,password,role});
  saveUsers(users);
  renderUsersTable();
  document.getElementById('nu-name').value='';
  document.getElementById('nu-user').value='';
  document.getElementById('nu-pass').value='';
  showToast(`Usuario "${name}" creado`);

function deleteUser(i){
  const users=getUsers();
  if(users[i].username===currentUser.username){showToast('No puedes eliminarte a ti mismo');return;}
  if(!confirm(`¿Eliminar al usuario "${users[i].name}"?`))return;
  users.splice(i,1);
  saveUsers(users);
  renderUsersTable();
  showToast('Usuario eliminado');
}

function buildKeyOptions(displayKey){
  const isMin=keyIsMinor(displayKey);
  const base=isMin?KEY_OPTS_MENOR:KEY_OPTS_MAYOR;
  return base.map(k=>`<option value="${k}" ${k===displayKey?'selected':''}>${k}</option>`).join('');
}
function renderSongDetail(displayKey){
  const s=currentSong;
  const baseI=keyIdx(s.key),dispI=keyIdx(displayKey);
  const semis=((dispI-baseI)+12)%12;
  const sections=s.sections.map(sec=>({...sec,lyrics:sec.lyrics.map(line=>({...line,chords:(line.chords||[]).map(c=>c?transposeChord(c,semis):'')}))}) );
  const half=Math.ceil(sections.length/2);
  const leftS=sections.slice(0,half),rightS=sections.slice(half);
  function renderSec(sec){
    const isC=sec.type==='chorus';
    const linesHTML=sec.lyrics.map(line=>{
      const wordTokens=line.words.split(/(\s+)/).filter(w=>/\S/.test(w));
      const chords=(line.chords||[]).filter(c=>c!==undefined);
      let ci=0;
      const syls=wordTokens.map(w=>{
        const ch=chords[ci]!==undefined?chords[ci++]:'';
        return`<div class="syl"><span class="syl-chord ${ch?'':'empty'}">${ch||'|'}</span><span class="syl-text">${w} </span></div>`;
      });
      return`<div class="chord-row">${syls.join('')}</div>`;
    }).join('');
    const secClass=`sheet-section${isC?' sheet-chorus':''}`;
    const inner=sec.bis?`<div class="bis-wrapper">${linesHTML}<div class="bis-bracket"></div><div class="bis-label">Bis</div></div>`:linesHTML;
    return`<div class="${secClass}"><div class="sheet-section-name">${sec.name}</div>${inner}</div>`;
  }
  const sheet=`<div class="song-sheet" id="sheet-printable">
    <div class="sheet-org">${s.org||'Cantoral litúrgico'}</div>
    <div class="sheet-tag">${s.moments[0]||''}</div>
    <div class="sheet-title">${s.title}</div>
    ${s.subtitle?`<div class="sheet-subtitle">${s.subtitle}</div>`:''}
    <hr class="sheet-divider">
    <div class="sheet-columns">
      <div>${leftS.map(renderSec).join('')}</div>
      <div>${rightS.map(renderSec).join('')}</div>
    </div>
    <div class="sheet-page">Página 1 | 1</div>
  </div>`;
  const keyOpts=buildKeyOptions(displayKey);
  const otherPool=keyIsMinor(displayKey)?KEY_OPTS_MAYOR:KEY_OPTS_MENOR;
  document.getElementById('song-detail').innerHTML=`
    <div class="song-view-header">
      <div class="song-view-title">${s.title}</div>
      <div class="song-view-meta">${s.author||''} · Tonalidad base: ${s.key} · ${s.moments.join(', ')}</div>
      <div class="toolbar">
        <div class="key-selector">
          <label>Tono:</label>
          <select onchange="renderSongDetail(this.value)">
            <optgroup label="Mayor">${keyOpts}</optgroup>
            <optgroup label="Menor">${otherPool.map(k=>`<option value="${k}">${k}</option>`).join('')}</optgroup>
          </select>
        </div>
        <button class="tool-btn" onclick="transposeBy(-1,'${displayKey}')">♭ Bajar</button>
        <button class="tool-btn" onclick="transposeBy(1,'${displayKey}')">♯ Subir</button>
        ${isDirector()?`<button class="tool-btn accent" onclick="addToPauta2(${s.id})">+ Pauta</button>`:''}
        ${isDirector()?`<button class="tool-btn" onclick="toggleEditPanel(${s.id})">✏️ Editar</button>`:''}
        <button class="tool-btn" onclick="printSong()">🖨 Imprimir</button>
        ${s.pdfUrl?`<button class="tool-btn" onclick="window.open('${s.pdfUrl}','_blank')">📄 Ver PDF en Drive</button>`:'<span style="font-size:11px;color:var(--text3);padding:4px 8px">Sin PDF</span>'}
        ${isDirector()&&s.pdfUrl?`<button class="tool-btn" id="ai-import-btn" onclick="importSongWithAI(${s.id})" style="background:linear-gradient(135deg,#6a00f4,#c800ff);color:#fff;border:none;">🤖 Importar con IA</button>`:''}
      </div>
    </div>
    <div class="song-scroll-area">${sheet}</div>
    ${s.mp3Url?`<div class="audio-bar">
      <button class="play-btn" id="play-btn" onclick="togglePlay('${s.mp3Url}')">▶</button>
      <div class="audio-info">
        <div class="audio-filename">${s.title}.mp3</div>
        <div class="audio-progress" onclick="seekAudio(event)"><div class="audio-fill" id="audio-fill"></div></div>
      </div></div>`:`<div class="audio-bar"><span style="font-size:11px;color:var(--text3)">🎵 Sin MP3 — sincroniza con Google Drive para reproducir</span></div>`}
    <div id="edit-song-panel" class="edit-song-panel" style="display:none"></div>`;
}

async function importSongWithAI(id){
  const s=songs.find(x=>x.id===id);
  if(!s)return;

  // Create hidden file input and trigger it
  let input=document.getElementById('ai-pdf-input');
  if(!input){
    input=document.createElement('input');
    input.type='file';input.accept='application/pdf';
    input.id='ai-pdf-input';input.style.display='none';
    document.body.appendChild(input);
  }
  input.value='';
  input.onchange=async()=>{
    const file=input.files[0];
    if(!file)return;

    const btn=document.getElementById('ai-import-btn');
    if(btn){btn.disabled=true;btn.textContent='🤖 Leyendo PDF...';}
    const panel=document.getElementById('edit-song-panel');
    if(panel){
      panel.style.display='block';
      panel.className='ai-loading-bar';
      panel.innerHTML='🤖 Claude está leyendo el PDF y extrayendo letra y acordes... esto tarda unos segundos.';
    }

    try{
      // Convert PDF to base64
      const base64=await new Promise((res,rej)=>{
        const r=new FileReader();
        r.onload=()=>res(r.result.split(',')[1]);
        r.onerror=rej;
        r.readAsDataURL(file);
      });

      // Send to Claude API
      const aiResp=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:4000,
          messages:[{
            role:'user',
            content:[
              {type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},
              {type:'text',text:`Analiza este cancionero litúrgico y extrae la estructura completa de la canción.
Responde SOLO con un objeto JSON válido, sin texto adicional, sin markdown, sin backticks.

El JSON debe tener esta estructura exacta:
{
  "title": "Título de la canción",
  "author": "Autor si aparece",
  "key": "Tonalidad base (ej: SOL, DO, RE, MIm)",
  "subtitle": "Subtítulo si existe (ej: Pascua Joven)",
  "org": "Organización si aparece (ej: Cantoral litúrgico)",
  "sections": [
    {
      "name": "Verso 1",
      "type": "verso",
      "bis": false,
      "lyrics": [
        {"chords": ["SOL","DO","RE"], "words": "texto de la línea"},
        {"chords": ["Mim","DO"], "words": "otra línea"}
      ]
    },
    {
      "name": "Estribillo",
      "type": "chorus",
      "bis": true,
      "lyrics": [{"chords": ["Mim","DO","SOL"], "words": "texto del estribillo"}]
    }
  ]
}

Reglas:
- type: "verso" para versos, "chorus" para estribillos
- bis: true si hay indicación "Bis" o llave de repetición
- chords: array con acordes de esa línea en orden. Si no hay acordes usa []
- words: texto de la línea sin acordes
- Detecta todos los versos y estribillos por separado
- Acordes en español: Do Re Mi Fa Sol La Si y variantes (Mim, Rem, Lam, etc.)
- key: la tonalidad principal de la canción`}
            ]
          }]
        })
      });

      if(!aiResp.ok){
        const err=await aiResp.json();
        throw new Error(err.error?.message||'Error API Claude '+aiResp.status);
      }

      const aiData=await aiResp.json();
      const raw=aiData.content.map(b=>b.text||'').join('');
      const clean=raw.replace(/```json|```/g,'').trim();
      const parsed=JSON.parse(clean);

      if(parsed.title)s.title=parsed.title;
      if(parsed.author)s.author=parsed.author;
      if(parsed.key)s.key=parsed.key;
      if(parsed.subtitle)s.subtitle=parsed.subtitle;
      if(parsed.org)s.org=parsed.org;
      if(parsed.sections&&parsed.sections.length)s.sections=parsed.sections;

      localStorage.setItem('sng3',JSON.stringify(songs));
      renderList();
      renderSongDetail(s.key);
      showToast('✅ Importado: '+s.sections.length+' secciones extraídas');

    }catch(e){
      console.error(e);
      if(panel){
        panel.className='ai-error-bar';
        panel.innerHTML='❌ Error: '+e.message;
      }
      if(btn){btn.disabled=false;btn.textContent='🤖 Importar con IA';}
    }
  };
  input.click();
}


function transposeBy(delta,currentKey){
  const i=keyIdx(currentKey),isMin=keyIsMinor(currentKey);
  const pool=isMin?KEY_OPTS_MENOR:KEY_OPTS_MAYOR;
  const ni=((i+delta)+12)%12;
  const found=pool.find(k=>keyIdx(k)===ni)||pool[ni%pool.length];
  renderSongDetail(found);
}

function togglePlay(url){
  if(!audioEl){audioEl=new Audio();audioEl.ontimeupdate=updateProgress;}
  if(audioEl.src!==url){audioEl.src=url;audioEl.play();playing=true;}
  else if(playing){audioEl.pause();playing=false;}
  else{audioEl.play();playing=true;}
  const btn=document.getElementById('play-btn');
  if(btn)btn.textContent=playing?'⏸':'▶';
}
function updateProgress(){const f=document.getElementById('audio-fill');if(f&&audioEl.duration)f.style.width=(audioEl.currentTime/audioEl.duration*100)+'%';}
function seekAudio(e){if(!audioEl||!audioEl.duration)return;const r=e.currentTarget.getBoundingClientRect();audioEl.currentTime=((e.clientX-r.left)/e.currentTarget.offsetWidth)*audioEl.duration;}

function renderMoments(){
  const grid=document.getElementById('moments-grid');if(!grid)return;
  const dir=isDirector();
  grid.innerHTML=MOMENTS.map((m,idx)=>`
    <div class="moment-card" draggable="${dir}" data-idx="${idx}"
      ondragstart="onDragStart(event,${idx})"
      ondragover="onDragOver(event,${idx})"
      ondragleave="onDragLeave(event)"
      ondrop="onDrop(event,${idx})"
      ondragend="onDragEnd(event)">
      <div class="moment-header">
        ${dir?`<span class="drag-handle" title="Arrastrar para reordenar">⠿</span>`:''}
        <div class="moment-dot" style="background:${m.color}"></div>
        <span class="moment-name">${m.name}</span>
        <span class="moment-count">${(pauta.slots[m.name]||[]).length} canción(es)</span>
        ${dir?`<div class="moment-actions-btns">
          <button class="m-btn" onclick="editCat('${m.name}')" title="Editar">✏️</button>
          <button class="m-btn del" onclick="deleteCat('${m.name}')" title="Eliminar">🗑</button>
        </div>`:''}
      </div>
      <div class="moment-drop">
        ${!(pauta.slots[m.name]||[]).length
          ?'<div class="drop-hint">Usa el botón + en la lista de canciones</div>'
          :(pauta.slots[m.name]||[]).map(id=>{
            const s=songs.find(x=>x.id===id);if(!s)return'';
            return`<div class="pauta-song">
              <div style="flex:1"><div class="ps-title">${s.title}</div><div class="ps-sub">${s.key}${s.author?' · '+s.author:''}</div></div>
              ${dir?`<button class="remove-song" onclick="removeFromPauta('${m.name}',${id})">×</button>`:''}
            </div>`;}).join('')}
      </div>
    </div>`).join('');
  const f=document.getElementById('pauta-fecha');if(f)f.value=pauta.fecha||'';
  const ti=document.getElementById('pauta-tipo');if(ti)ti.value=pauta.tipo||'';
  const l=document.getElementById('pauta-liturgia');if(l)l.value=pauta.liturgia||'';
  const p=document.getElementById('pauta-parroquia');if(p)p.value=pauta.parroquia||'';
  const r=document.getElementById('pauta-responsable');if(r)r.value=pauta.responsable||'';
}

// DRAG & DROP para reordenar categorías
let _dragIdx=null;
function onDragStart(e,idx){if(!isDirector())return;_dragIdx=idx;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function onDragOver(e,idx){if(!isDirector()||_dragIdx===null||_dragIdx===idx)return;e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drag-over');}
function onDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function onDrop(e,idx){
  if(!isDirector()||_dragIdx===null||_dragIdx===idx)return;
  e.preventDefault();
  const moved=MOMENTS.splice(_dragIdx,1)[0];
  MOMENTS.splice(idx,0,moved);
  _dragIdx=null;
  saveMoments();renderMoments();
}
function onDragEnd(e){
  _dragIdx=null;
  document.querySelectorAll('.moment-card').forEach(c=>{c.classList.remove('dragging','drag-over');});
}

function addToPauta(e,id){
  if(!isDirector()){showToast('Solo el Director puede editar la pauta');return;}
  e.stopPropagation();
  const s=songs.find(x=>x.id===id);if(!s)return;
  const moment=s.moments[0]||MOMENTS[0]?.name||'Entrada';
  if(!pauta.slots[moment])pauta.slots[moment]=[];
  if(!pauta.slots[moment].includes(id)){
    pauta.slots[moment].push(id);savePauta();renderMoments();
    showToast(`"${s.title}" → ${moment}`);
  }else showToast('Ya está en la pauta');
}
function addToPauta2(id){addToPauta({stopPropagation:()=>{}},id);}
function removeFromPauta(moment,id){
  if(!isDirector())return;
  pauta.slots[moment]=(pauta.slots[moment]||[]).filter(x=>x!==id);
  savePauta();renderMoments();
}
function clearPauta(){
  if(!isDirector())return;
  if(!confirm('¿Borrar toda la pauta?'))return;
  MOMENTS.forEach(m=>pauta.slots[m.name]=[]);savePauta();renderMoments();
}
function savePauta(){
  pauta.fecha=document.getElementById('pauta-fecha')?.value||pauta.fecha;
  pauta.tipo=document.getElementById('pauta-tipo')?.value||pauta.tipo;
  pauta.liturgia=document.getElementById('pauta-liturgia')?.value||pauta.liturgia;
  pauta.parroquia=document.getElementById('pauta-parroquia')?.value||pauta.parroquia;
  pauta.responsable=document.getElementById('pauta-responsable')?.value||pauta.responsable;
  localStorage.setItem('pau3',JSON.stringify(pauta));
}
function exportPauta(){
  if(!isDirector())return;
  savePauta();
  let txt=`PAUTA DE MISA — TEMPVS7 2.0\n${'═'.repeat(40)}\n`;
  txt+=`Fecha: ${pauta.fecha||'---'}\nLiturgia: ${pauta.liturgia||'---'}\nComunidad: ${pauta.parroquia||'---'}\nResponsable: ${pauta.responsable||'---'}\n`;
  MOMENTS.forEach(m=>{
    txt+=`\n${m.name.toUpperCase()}\n${'-'.repeat(20)}\n`;
    const ids=pauta.slots[m.name]||[];
    if(!ids.length)txt+='(sin canciones)\n';
    ids.forEach(id=>{const s=songs.find(x=>x.id===id);if(s)txt+=`• ${s.title} (${s.key}) — ${s.author||''}\n`;});
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download=`pauta-${pauta.fecha||'sin-fecha'}.txt`;
  a.click();showToast('Pauta exportada');
}
function sharePauta(){
  savePauta();
  const url=location.href.split('?')[0]+'?pauta='+btoa(JSON.stringify(pauta));
  navigator.clipboard.writeText(url).then(()=>showToast('Link copiado al portapapeles'));
}

const CAT_COLORS=['#5aaa7a','#a064dc','#5a8cdc','#c9a84c','#e05a5a','#e08844','#44b8c8','#c85a8a','#7ab844','#0067c0'];
let _selectedColor=CAT_COLORS[0];

function openCatModal(editName){
  if(!isDirector())return;
  document.getElementById('cat-modal-title').textContent=editName?'Editar categoría':'Nueva categoría';
  document.getElementById('cat-name-input').value=editName||'';
  document.getElementById('cat-edit-name').value=editName||'';
  const current=editName?MOMENTS.find(m=>m.name===editName)?.color:CAT_COLORS[0];
  _selectedColor=current||CAT_COLORS[0];
  document.getElementById('color-row').innerHTML=CAT_COLORS.map(c=>`
    <div class="color-swatch ${c===_selectedColor?'selected':''}" style="background:${c}" onclick="selectSwatch('${c}',this)"></div>`).join('');
  document.getElementById('cat-modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('cat-name-input').focus(),80);
}
function selectSwatch(color,el){
  _selectedColor=color;
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));
  el.classList.add('selected');
}
function closeCatModal(e){if(e&&e.target!==document.getElementById('cat-modal-overlay'))return;document.getElementById('cat-modal-overlay').classList.remove('open');}
function closeCatModalDirect(){document.getElementById('cat-modal-overlay').classList.remove('open');}
function saveCatModal(){
  const name=document.getElementById('cat-name-input').value.trim();
  if(!name){showToast('Escribe un nombre');return;}
  const oldName=document.getElementById('cat-edit-name').value;
  if(oldName&&oldName!==name){
    if(pauta.slots[oldName]){pauta.slots[name]=pauta.slots[oldName];delete pauta.slots[oldName];}
    const m=MOMENTS.find(x=>x.name===oldName);if(m){m.name=name;m.color=_selectedColor;}
  }else if(oldName){
    const m=MOMENTS.find(x=>x.name===oldName);if(m)m.color=_selectedColor;
  }else{
    if(MOMENTS.find(m=>m.name===name)){showToast('Ya existe esa categoría');return;}
    MOMENTS.push({name,color:_selectedColor});
    if(!pauta.slots[name])pauta.slots[name]=[];
  }
  saveMoments();savePauta();renderMoments();renderFilterChips();
  document.getElementById('cat-modal-overlay').classList.remove('open');
  showToast(oldName?'Categoría actualizada':'Categoría creada: '+name);
}
function editCat(name){openCatModal(name);}
function deleteCat(name){
  if(!isDirector())return;
  if(!confirm(`¿Eliminar la categoría "${name}"?`))return;
  MOMENTS=MOMENTS.filter(m=>m.name!==name);
  delete pauta.slots[name];
  saveMoments();savePauta();renderMoments();renderFilterChips();
  showToast('Categoría eliminada');
}

function loadPublicView(encoded){
  try{
    const data=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(encoded)))));
    document.body.classList.add('is-public');
    const moments=data.moments||[];
    let html=`<div class="pub-header">
      <div class="pub-title">✝ TEMPVS7 — Pauta de Misa</div>
      <div class="pub-meta">${data.tipo?'🙏 '+data.tipo:''} ${data.fecha?'· 📅 '+data.fecha:''}</div>
      <div class="pub-meta">${data.liturgia?'✝ '+data.liturgia:''}</div>
      ${data.parroquia?`<div class="pub-meta">⛪ ${data.parroquia}</div>`:''}
    </div>`;
    moments.forEach(m=>{
      const ids=(data.slots&&data.slots[m.name])||[];
      if(!ids.length)return;
      html+=`<div class="pub-category"><div class="pub-cat-name" style="color:${m.color}">${m.name}</div>`;
      ids.forEach(id=>{
        const s=songs.find(x=>x.id===id)||{title:'(canción)',key:'',author:''};
        html+=`<div class="pub-song-card" style="border-left-color:${m.color}">
          <div class="pub-song-title">${s.title}</div>
          <div class="pub-song-sub">${s.key?s.key+' · ':''}${s.author||''}</div>
        </div>`;
      });
      html+='</div>';
    });
    if(!moments.length)html+='<p style="text-align:center;color:var(--text3);margin-top:2rem">Sin canciones en esta pauta.</p>';
    document.getElementById('public-view').innerHTML=html;
  }catch(e){document.getElementById('public-view').innerHTML='<p style="padding:2rem;color:var(--text3)">No se pudo cargar la pauta.</p>';}
}

async function loadFromDrive(){
  const cfg=JSON.parse(localStorage.getItem('cfg')||'{}');
  if(!cfg.folderId||!cfg.apiKey){showToast('Configura ID de carpeta PDFs y API Key');return;}
  showToast('Conectando con Drive...');
  try{
    // Leer carpeta de PDFs
    const urlPdf=`https://www.googleapis.com/drive/v3/files?q='${cfg.folderId}'+in+parents&key=${cfg.apiKey}&fields=files(id,name,mimeType)&pageSize=1000`;
    const dataPdf=await fetch(urlPdf).then(r=>r.json());
    if(dataPdf.error){showToast('Error PDFs: '+dataPdf.error.message);return;}
    const pdfs=(dataPdf.files||[]).filter(f=>f.mimeType==='application/pdf');

    // Leer carpeta de MP3s (puede ser distinta)
    let mp3s=[];
    const mp3FolderId=cfg.folderIdMp3||cfg.folderId;
    if(mp3FolderId===cfg.folderId){
      mp3s=(dataPdf.files||[]).filter(f=>f.mimeType==='audio/mpeg');
    }else{
      const urlMp3=`https://www.googleapis.com/drive/v3/files?q='${mp3FolderId}'+in+parents&key=${cfg.apiKey}&fields=files(id,name,mimeType)&pageSize=1000`;
      const dataMp3=await fetch(urlMp3).then(r=>r.json());
      if(dataMp3.error){showToast('Aviso: no se pudo leer carpeta MP3: '+dataMp3.error.message);}
      else{mp3s=(dataMp3.files||[]).filter(f=>f.mimeType==='audio/mpeg');}
    }

    let added=0;
    pdfs.forEach(pdf=>{
      const base=pdf.name.replace(/\.pdf$/i,'');
      const existing=songs.find(s=>s.title===base);
      const mp3=mp3s.find(m=>m.name.replace(/\.mp3$/i,'')===base);
      const mp3Url=mp3?`https://www.googleapis.com/drive/v3/files/${mp3.id}?alt=media&key=${cfg.apiKey}`:'';
      const pdfUrl=`https://drive.google.com/file/d/${pdf.id}/view`;
      if(!existing){
        songs.push({id:Date.now()+added,title:base,author:'',key:'SOL',subtitle:'',org:'TEMPVS7',
          moments:[MOMENTS[0]?.name||'Entrada'],pdfUrl,mp3Url,
          sections:[{name:'Letra',type:'verso',bis:false,lyrics:[{chords:['SOL'],words:'Letra pendiente de edición'}]}]});
        added++;
      }else{existing.pdfUrl=pdfUrl;if(mp3Url)existing.mp3Url=mp3Url;}
    });
    localStorage.setItem('sng3',JSON.stringify(songs));
    renderList();renderFilterChips();
    showToast(`Sincronizado: ${added} nuevas, ${pdfs.length-added} actualizadas · ${mp3s.length} MP3s`);
  }catch(e){showToast('Error de conexion: '+e.message);}
}

  songs=[];
